# HOWL test corpus — pinned external ontologies.
#
# NOT COMMITTED. These are fetched on demand and verified by SHA-256; see
# corpus/fetch.sh and `make corpus`. Sizes make committing them impractical
# (GO alone is 129 MB) and their licences differ from HOWL's.
#
# EVERY `url` IS A VERSIONED PURL, NEVER A "LATEST" ONE. `.../obo/ro.owl`
# redirects to whatever the current release is, so a hash pinned against it
# breaks on the next release and the corpus silently stops being reproducible.
# The versioned PURLs are immutable — verified for ro.owl, whose versioned and
# latest fetches are byte-identical at this release.
#
# `out_of_profile` is measured by corpus/census.py against SPEC.md §5.2 and is
# the reason each entry does or does not need a projection (§10 item 2). A
# benchmark or differential run over an entry with non-empty coverage.omitted
# compares different theories, and a TIMING run makes HOWL look fast precisely
# to the extent that it skipped work.
#
# TURTLE IS DERIVED, AND ONLY THE SOURCE IS PINNED. HOWL reads Turtle only
# (SPEC.md §6.1), so corpus/fetch.sh converts each verified .owl to a sibling
# .ttl with rdflib. The .ttl is NOT hashed: rdflib's Turtle output is not
# deterministic (two conversions of RO hash differently), and canonical
# blank-node relabelling, which is, took 9.3 hours on OBI. Pinning the converter
# keeps the derivation reproducible in content; fetch.sh warns when it differs.
converter_rdflib = "7.6.0"

[[ontology]]
name           = "ro"
version        = "2025-12-17"
url            = "http://purl.obolibrary.org/obo/ro/releases/2025-12-17/ro.owl"
sha256         = "a9f644d4a865747e0b4aba7ca3f19aac1e0b072cab89e24a2e476df3abb10aaf"
bytes          = 1_226_000
licence        = "CC BY 4.0"
logical_axioms = 1978
in_v0          = 1417
out_of_profile = 561
projection     = "corpus/projections/ro-2025-12-17.removals"
projection_removes = { axioms = 387, triples = 1616, in_v0_swept_in = 62 }
role           = "RBOX. 160 property chains, 45 transitive properties, 801 sub-property axioms — by far the best exercise available for CR6/CR7, which have no fixtures of their own. Also the SWRL case: 25 rules, 2 of which derive owl:Nothing."

[[ontology]]
name           = "obi"
version        = "2026-07-27"
url            = "http://purl.obolibrary.org/obo/obi/2026-07-27/obi.owl"
sha256         = "8874abcca971ee26b4e4442198387916d788d14af3519e1040474908ed12b946"
bytes          = 9_961_000
licence        = "CC BY 4.0"
logical_axioms = 26811
in_v0          = 26399
out_of_profile = 412
projection     = "corpus/projections/obi-2026-07-27.removals"
projection_removes = { axioms = 381, triples = 5826, in_v0_swept_in = 1243 }
role           = "PRIMARY v0 ENTRY. Only 1.5% out-of-profile over 26k in-profile axioms — the closest fit to v0 of anything measured, and large enough to be a real differential and benchmark target."

[[ontology]]
name           = "go"
version        = "2026-07-26"
url            = "http://purl.obolibrary.org/obo/go/releases/2026-07-26/go.owl"
sha256         = "653ce47cd7b02304e67eb67c54d3be02ec5b0ba5e00eb7384dfa0da00f9682ec"
bytes          = 135_000_000
licence        = "CC BY 4.0"
logical_axioms = 117791
in_v0          = 117790
out_of_profile = 1
projection     = "corpus/projections/go-2026-07-26.removals"
projection_removes = { axioms = 1, triples = 1, in_v0_swept_in = 0 }
role           = "BENCHMARK, and the headline result of the census: 1.4M triples, 117,790 in-profile logical axioms, and exactly ONE out-of-profile axiom — a single owl:inverseOf. The canonical EL benchmark named in §12 is essentially inside v0 already, and its projection is a one-axiom diff that a human can audit by eye. The hash above is from the latest-PURL fetch; the versioned URL is pinned on the strength of ro.owl's verified byte-identical match, and fetch.sh catches it loudly if that assumption is wrong."

# EL-GALEN, the variant CEL, Snorocket and ELK benchmark as "EL-GALEN" /
# "GALEN-EL": §12 requires GALEN and warns that the name covers ontologies of
# wildly differing difficulty, so the VARIANT is the pin. The source is OWL 2
# FUNCTIONAL SYNTAX, which rdflib cannot read: fetch.sh converts it with the
# pinned OWL API (`oracle convert`, oracle/), after checking it repeats no
# operand the OWL API would collapse. That conversion is deterministic for a
# pinned OWL API (two runs, byte-identical), so unlike the rdflib path its
# output IS pinned, as derived_sha256.
[[ontology]]
name           = "el-galen"
version        = "2011-04-12"
format         = "ofn"
url            = "https://raw.githubusercontent.com/ghxiao/drew/c8dbd015e6b39c69d9000e2e2a4b8c05769aca07/benchmark/galen/ontology/EL-GALEN.owl"
sha256         = "4692482660fce56ede0d4587bd8c84af6a8428a62b668cecf976eb1ae4aff4cd"
derived_sha256 = "52fd1c94972b5ca8204159eb78daf8cfb5e426f6a79d2c0b12a48814a9a199bf"
bytes          = 10_401_844
licence        = "none stated (CO-ODE OpenGALEN origin); the hosting repository is Apache-2.0"
provenance     = "EL fragment of the CO-ODE OpenGALEN ontology (IRI http://www.co-ode.org/ontologies/galen), obtained by removing InverseObjectProperties, FunctionalObjectProperties and role-chain axioms (ELK TestOntologies wiki). Distributed by Kazakov/Simancik as EL-GALEN.owl on code.google.com/p/condor-reasoner, uploaded 2011-04-12 (sha1 08f62ef75d508b0099b57e190dd902a3d9327b71); byte-identical to galen.owl in ELK's test_ontologies_01.zip. Fetched from ghxiao/drew (DReW, TU Wien) commit c8dbd015e6b39c69d9000e2e2a4b8c05769aca07, path benchmark/galen/ontology/EL-GALEN.owl, git blob 88ae4dd69ade947ec9f27ee387a193dfd7ebc6b4. 23,136 classes, 950 object properties, 36,547 logical axioms."
logical_axioms = 81513
in_v0          = 81513
out_of_profile = 0
projection     = "corpus/projections/el-galen-2011-04-12.removals"
projection_removes = { axioms = 0, triples = 0, in_v0_swept_in = 0 }
role           = "BENCHMARK, with GO: plain EL (intersection, existentials, role hierarchy, transitivity; no ranges, chains or inverses), so ELK is its routed oracle. Entirely inside v0: an empty projection."

