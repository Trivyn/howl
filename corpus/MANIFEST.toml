provenance     = "CommonCoreOntologies tag v2.0-2024-11-06 (commit 510dad76), src/cco-merged/CommonCoreOntologiesMerged.ttl: byte-identical to the copy every earlier CCO measurement used."
role           = "M5 TARGET, the first consumer's mid-level ontology, with an ABox: 127 InverseObjectProperties, unions and universals outside el and el++, and data axioms the data lemma sets aside. sriq's gate omits nothing of it (M5 (g))."

