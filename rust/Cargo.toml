[package]
name = "howl-reasoner"
version = "0.4.0"
edition = "2021"
rust-version = "1.63"
description = "Rust bindings for the HOWL consequence-based description-logic reasoner"
license = "Apache-2.0"
repository = "https://github.com/Trivyn/howl"
keywords = ["owl", "rdf", "reasoner", "ontology", "description-logic"]
categories = ["science", "algorithms"]
readme = "README.md"
include = [
    "src/**/*",
    # Not tests/: they reproduce the repository's corpus goldens, which are
    # not packaged. The layout guards live in src/ and ship.
    "csrc/**/*",
    "include/**/*",
    "layout_probes.c",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

# `howl` on crates.io is an unrelated crate; the library keeps the name, so
# callers write `use howl::...`.
[lib]
name = "howl"

[dependencies]
# The -sys crates generated on slop 0.5.0, runtime ABI 202601 (HOWL's C is
# generated on 0.5.1, the same ABI). Caret ranges: a later -sys release on
# another runtime ABI fails to compile against HOWL's runtime header (the
# generated headers' SLOP_RUNTIME_ABI check) instead of linking skewed.
slop-std-sys = "0.5.0"
slop-rdf-sys = "0.6.0"

[build-dependencies]
cc = "1"
