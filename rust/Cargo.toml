[package]
name = "howl-reasoner"
version = "0.1.0"
edition = "2021"
rust-version = "1.63"
description = "Rust bindings for the HOWL consequence-based description-logic reasoner"
license = "Apache-2.0"
repository = "https://github.com/Trivyn/howl"
keywords = ["owl", "rdf", "reasoner", "ontology", "description-logic"]
categories = ["science", "algorithms"]
readme = "README.md"
include = [
    "src/**/*",
    # Not tests/: they reproduce the repository's corpus goldens, which are
    # not packaged. The layout guards live in src/ and ship.
    "csrc/**/*",
    "include/**/*",
    "layout_probes.c",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

# `howl` on crates.io is an unrelated crate; the library keeps the name, so
# callers write `use howl::...`.
[lib]
name = "howl"

[dependencies]
# slop 0.4.2 and slop-rdf 0.5.1: the generation HOWL's csrc/ is built with.
# build.rs checks that the runtime header matches byte for byte, so the pins
# are exact: a caret let 0.1.0 resolve slop-std-sys 0.4.2 and fail to build.
slop-std-sys = "=0.4.2"
slop-rdf-sys = "=0.5.1"

[build-dependencies]
cc = "1"
