[package]
name = "howl"
version = "0.1.0"
edition = "2021"
rust-version = "1.63"
description = "Rust bindings for the HOWL consequence-based description-logic reasoner"
license = "Apache-2.0"
repository = "https://github.com/Trivyn/howl"
keywords = ["owl", "rdf", "reasoner", "ontology", "description-logic"]
categories = ["science", "algorithms"]
readme = "README.md"
include = [
    "src/**/*",
    # Not tests/: they reproduce the repository's corpus goldens, which are
    # not packaged. The layout guards live in src/ and ship.
    "csrc/**/*",
    "include/**/*",
    "layout_probes.c",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
# slop 0.4.0 and slop-rdf 0.5.0: the generation HOWL's csrc/ is built with.
# build.rs checks that the runtime header matches byte for byte.
slop-std-sys = "0.4.0"
slop-rdf-sys = "0.5.0"

[build-dependencies]
cc = "1"
