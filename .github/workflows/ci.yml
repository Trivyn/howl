name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            cc: gcc
          - os: macos-26
            platform: macos-arm64
            cc: gcc-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14 (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc@14

      # Builds from the committed C in csrc/ — no SLOP toolchain needed.
      - name: Run tests
        run: make test CC=${{ matrix.cc }}

      # The layout guards live here. They are the reason this job is not
      # optional: a mirror in rust/src/ffi.rs duplicates a struct
      # definition that lives in another repository and changes without
      # notice, and a drift is silent at both compile time and run time.
      - name: Build and test Rust crate
        run: make crate-test CC=${{ matrix.cc }}

      # The public C API as a C caller sees it: the example built against
      # the generated include/howl.h and libhowl.a alone, and every entry
      # point under ASan and UBSan. clang on both runners: Homebrew gcc on
      # macOS does not ship the sanitizer runtimes.
      - name: C API example and sanitizer test
        run: make c-example CC=clang

      - name: Build release CLI
        run: make release CC=${{ matrix.cc }}

      # M1 (e): the report is byte-identical at every worker count, capped
      # runs included. The ThreadSanitizer build runs on Linux only.
      - name: Reports identical across worker counts
        run: make determinism CC=${{ matrix.cc }}
      - name: ThreadSanitizer
        if: runner.os == 'Linux'
        run: make test-tsan CC=clang

      # A CI job that accepts exit 2 reintroduces the silent-false-pass
      # hazard the gate exists to prevent, so assert the codes rather than
      # assuming them. `make acceptance` runs §6.2's exit-code table over
      # every fixture it lists — 0 coherent, 1 incoherent, 2 inconclusive,
      # each where the fixture says — and a usage error must exit 3. (This
      # step once asserted "never 0", from before the pipeline existed; an
      # empty ontology is coherent, so it failed on every run since M0.)
      - name: Assert CLI exit codes
        run: |
          make acceptance CC=${{ matrix.cc }}
          set +e
          ./build/howl > /dev/null 2>&1
          usage=$?
          set -e
          echo "no-args exit=$usage"
          if [ "$usage" -ne 3 ]; then
            echo "FAIL: a usage error must exit 3, got $usage" >&2
            exit 1
          fi

  # The crate on Windows (#64): slop 0.4.2's runtime threads through Win32,
  # and the C compiles with clang-cl on MSVC and MinGW gcc on GNU, as in the
  # -sys crates. The vendored C comes from a Linux job, since `make` is not
  # on the Windows runner.
  crate-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make crate-vendor
      - uses: actions/upload-artifact@v4
        with:
          name: rust-vendored
          path: |
            rust/csrc
            rust/include
            rust/LICENSE

  windows:
    needs: crate-vendor
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-pc-windows-gnu]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-vendored
          path: rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # MinGW-w64 gcc for cc-rs on the GNU target.
      - if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - if: matrix.target == 'x86_64-pc-windows-gnu'
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> $env:GITHUB_PATH
        shell: pwsh
      - run: cargo test --target ${{ matrix.target }}
        working-directory: rust

  # The CLI and libhowl.a on Windows, as release.yml builds them: MinGW-w64 gcc
  # through the Makefile. Checked on every PR so a Windows break shows before a
  # tag. The sanitizer jobs stay on Linux and macOS.
  windows-cli:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Check out LF, as on Linux and macOS: the version checks read
      # slop.toml line by line, and a CR would end up in --version.
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-python make zip
      - name: Run tests
        run: make test CC=gcc
      # A report is LF on every platform (cli/windows/lf_stdout.c), and the
      # .exe imports only Windows' own DLLs, so it runs without MSYS2.
      - name: Build release CLI
        run: |
          set -e
          make release CC=gcc
          sh cli/windows/check-exe.sh
      - name: Build the C library
        run: make lib CC=gcc
      - name: Assert CLI exit codes
        run: make acceptance CC=gcc
      # determinism.py hashes the binary itself, by its full name.
      - name: Reports identical across worker counts
        run: HOWL=build/howl.exe make determinism CC=gcc

  verify:
    # Z3 weakest-precondition contract checking (SPEC §7). This proves
    # the implementation cannot drift from the calculus without a
    # contract failing. It does NOT prove soundness or completeness,
    # which are model-theoretic and come from the published proofs plus
    # differential testing — "verified faithful to a proven calculus" is
    # the honest phrase.
    runs-on: ubuntu-latest
    continue-on-error: true # until the SLOP toolchain is available in CI
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y z3
      - name: Verify contracts
        run: |
          if command -v slop >/dev/null 2>&1; then
            slop verify
          else
            echo "SLOP toolchain not available in CI; skipping contract verification."
            echo "Run 'make verify' locally. See SPEC.md §7."
          fi

  differential:
    # M1 acceptance (b), on the committed fixtures (SPEC §10 item 1): the
    # capability probes against HOWL, HermiT and ELK, then HOWL diffed as
    # entailments against HermiT on every fixture it reasons over
    # completely, and against ELK where the probes prove ELK capable.
    # Blocking: the fixtures are small, and a differential that only runs
    # on a laptop stops being run. The corpus differential (S4) stays local.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The oracle's pinned JDK (oracle/build.gradle.kts). Present here, the
      # Gradle toolchain uses it instead of provisioning one.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # census.py routes fixtures by construct; pinned as in corpus/MANIFEST.toml.
      - name: Install rdflib
        run: pip install rdflib==7.6.0
      # The projection's own self-tests need only rdflib; the corpus runs
      # themselves stay local.
      - name: Projection self-tests
        run: python3 -m unittest corpus/test_project.py
      - name: Probes and fixture differential
        run: make probes diff-fixtures
      # Pinned by commit and sha256 (corpus/conformance.sha256); a fetched
      # file that no longer matches its pin fails here, before anything runs.
      - name: External conformance (W3C OWL 2 EL, ELK classification)
        run: make conformance-fetch conformance
